name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-checks:
    name: Backend Lint, Type-Check & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "./backend[dev]"

      - name: Lint with Ruff
        run: |
          ruff check backend/

      - name: Check Formatting with Ruff
        run: |
          ruff format --check backend/

      - name: Type Check with Mypy
        run: |
          mypy --strict backend/src/marketpulse backend/tests

      - name: Run Pytest Suite
        run: |
          pytest backend/tests -v --cov=marketpulse.core --cov=marketpulse.sim --cov-report=term-missing

  frontend-checks:
    name: Frontend Lint, Type-Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Type-Check & Build Frontend
        working-directory: frontend
        run: npm run build
