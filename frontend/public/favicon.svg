<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="mp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Dark Rounded Container -->
  <rect width="64" height="64" rx="14" fill="#090d16" stroke="#1e293b" stroke-width="2"/>
  <!-- Bullish Candlestick Wick & Body -->
  <line x1="20" y1="12" x2="20" y2="52" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="15" y="22" width="10" height="20" rx="2" fill="#10b981" />
  <!-- Pulse Waveform through Center -->
  <path d="M6 32h14l4-8 6 18 5-14 4 6 5-2h14" stroke="url(#mp-grad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <!-- Secondary Candlestick Wick & Body -->
  <line x1="46" y1="16" x2="46" y2="48" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <rect x="42" y="24" width="8" height="14" rx="2" fill="#06b6d4" opacity="0.8"/>
</svg>